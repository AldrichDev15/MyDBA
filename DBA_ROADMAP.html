<script>
const phases=[

modules:[
{num:"1.1",title:"Configuración inicial de OL8.10",ol8:true,topics:[
"Registrar el sistema: dnf install oraclelinux-release-el8 + subscription-manager",
"Activar repos: ol8_baseos_latest, ol8_appstream, ol8_addons, ol8_UEKR7",
"UEK7 (Unbreakable Enterprise Kernel): instalar kernel-uek y reiniciar",
"Deshabilitar SELinux o configurar en permissive para Oracle DB",
"Configurar firewalld: abrir puertos 1521 (listener) y 5500 (OEM Express)",
"Sincronización de tiempo: chronyc sources — crítico para RAC y Data Guard"
],
resources:[
{label:"Oracle DB preinstall RPM para OL8",url:"https://oracle-base.com/articles/19c/oracle-db-19c-installation-on-oracle-linux-8"},
{label:"Doc oficial: OL8 Admin Guide",url:"https://docs.oracle.com/en/operating-systems/oracle-linux/8/"},
{label:"UEK Release Notes OL8",url:"https://docs.oracle.com/en/operating-systems/uek/7/relnotes8.0/"}
]},
{num:"1.2",title:"Prerequisitos del SO para Oracle Database",ol8:true,topics:[
"Instalar oracle-database-preinstall-19c (crea usuario oracle, grupos, ajusta kernel params automáticamente)",
"Parámetros kernel en /etc/sysctl.d/97-oracle.conf: shmall, shmmax, semaphores, file-max",
"Límites de usuario en /etc/security/limits.d/oracle.conf: nofile, nproc, stack",
"Deshabilitar Transparent Huge Pages (THP): grubby --update-kernel=ALL --args='transparent_hugepage=never'",
"Configurar swap: regla Oracle — si RAM < 2GB swap=2×RAM, si >8GB swap=8GB",
"Verificar con: sysctl -a | grep shm && ulimit -a como usuario oracle"
],
resources:[
{label:"Oracle DB Installation Guide 19c OL8 (doc oficial)",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/ladbi/index.html"},
{label:"oracle-base.com: prereqs OL8 paso a paso",url:"https://oracle-base.com/articles/19c/oracle-db-19c-installation-on-oracle-linux-8"}
]},
{num:"1.3",title:"Instalación Oracle Database 19c en OL8",ol8:true,topics:[
"Descargar 19c desde edelivery.oracle.com o MOS (My Oracle Support)",
"OUI (Oracle Universal Installer): modo silencioso vs gráfico con xterm/VNC",
"ORACLE_BASE, ORACLE_HOME, ORACLE_SID en .bash_profile del usuario oracle",
"Instalar DB Software only + crear DB con DBCA (Database Configuration Assistant)",
"DBCA: elegir tipo General Purpose, charset AL32UTF8, enable archivelog desde inicio",
"Verificar: lsnrctl status, sqlplus / as sysdba, SELECT * FROM v$version"
],
resources:[
{label:"DBCA Silent Mode — parámetros completos",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/admin/creating-and-configuring-an-oracle-database.html"},
{label:"edelivery.oracle.com — descarga oficial",url:"https://edelivery.oracle.com"},
{label:"MOS (My Oracle Support) — requiere cuenta",url:"https://support.oracle.com"}
]}
]},

{id:"p2",tag:"oracle",cert:false,status:"current",label:"Fase 2",title:"Arquitectura interna Oracle — los cimientos",duration:"Meses 1–2",
modules:[
{num:"2.1",title:"Memory structures: SGA y PGA",topics:[
"SGA: Database Buffer Cache (LRU, dirty buffers), Shared Pool (library cache, data dictionary cache)",
"Redo Log Buffer: cómo LGWR escribe y cuándo hace commit",
"Large Pool, Java Pool, Streams Pool — cuándo importan",
"PGA: Stack Space, Sort Area, Hash Area — gestionada por PGA_AGGREGATE_TARGET",
"AMM vs ASMM vs gestión manual — cuándo usar cada uno en OL8",
"Consultar: v$sga, v$sgastat, v$pga_target_advice, v$memory_target_advice"
],
resources:[
{label:"Oracle 19c Concepts: Memory Architecture (doc oficial)",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/memory-architecture.html"},
{label:"oracle-base.com: AMM y ASMM explicados",url:"https://oracle-base.com/articles/11g/automatic-memory-management-11gr1"}
]},
{num:"2.2",title:"Procesos background",topics:[
"DBWn: Database Writer — cuándo escribe al disco y por qué es asíncrono",
"LGWR: Log Writer — commit y la importancia del redo log group",
"CKPT: Checkpoint — actualiza headers, reduce recovery time",
"SMON: recuperación de instancia, limpieza de temp segments",
"PMON: limpieza de procesos muertos, re-registro en listener",
"ARCn: Archiver — sólo en ARCHIVELOG mode, crítico para backups",
"Monitorizar con: SELECT * FROM v$bgprocess WHERE paddr != '00'"
],
resources:[
{label:"Oracle 19c Concepts: Process Architecture",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/process-architecture.html"}
]},
{num:"2.3",title:"Storage: tablespaces, segments, extents, blocks",topics:[
"Jerarquía: Database → Tablespace → Segment → Extent → Block (2KB–32KB)",
"Tablespaces del sistema: SYSTEM, SYSAUX, TEMP, UNDOTBS1, USERS",
"AUTOEXTEND vs pre-allocated — cuándo usar en producción",
"OMF (Oracle Managed Files): simplifica administración de ficheros",
"Bigfile tablespace vs smallfile — ventajas en sistemas modernos",
"Vistas clave: dba_tablespaces, dba_data_files, dba_free_space, dba_segments"
],
resources:[
{label:"Oracle 19c Concepts: Logical Storage",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/logical-storage-structures.html"},
{label:"Oracle 19c Concepts: Physical Storage",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/physical-storage-structures.html"}
]},
{num:"2.4",title:"Startup, shutdown y alert log",topics:[
"Fases: SHUTDOWN → NOMOUNT → MOUNT → OPEN — qué ocurre en cada una",
"Modos de shutdown: NORMAL, IMMEDIATE, TRANSACTIONAL, ABORT",
"Alert log: ubicación con SHOW PARAMETER background_dump_dest o ADR",
"ADRCI: herramienta para gestionar el ADR (Automatic Diagnostic Repository)",
"Archivo init.ora vs SPFILE — ventajas del SPFILE, cómo crear y editar",
"Práctica: rompe el SPFILE y recupera arrancando con pfile"
],
resources:[
{label:"Oracle 19c Admin: Starting Up & Shutting Down",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/admin/starting-up-and-shutting-down.html"},
{label:"ADRCI reference",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/sutil/oracle-adrci-utility.html"}
]}
]},

{id:"p3",tag:"oracle",cert:true,status:"current",label:"Fase 3",title:"SQL avanzado, PL/SQL y primera certificación",duration:"Meses 2–4",
modules:[
{num:"3.1",title:"SQL Oracle avanzado",topics:[
"Analytic functions: ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, NTILE, RATIO_TO_REPORT",
"LISTAGG, XMLAGG, JSON_ARRAYAGG — agregaciones complejas",
"Hierarchical queries: CONNECT BY PRIOR, LEVEL, SYS_CONNECT_BY_PATH, NOCYCLE",
"Flashback queries: AS OF TIMESTAMP, AS OF SCN, VERSIONS BETWEEN",
"Model clause: cálculos estilo spreadsheet en SQL puro",
"PIVOT y UNPIVOT — transformar filas en columnas y viceversa"
],
resources:[
{label:"Oracle Live SQL — practica en browser sin instalar",url:"https://livesql.oracle.com"},
{label:"Oracle 19c SQL Language Reference",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/index.html"},
{label:"oracle-base.com: Analytic Functions",url:"https://oracle-base.com/articles/misc/analytic-functions"}
]},
{num:"3.2",title:"PL/SQL — de básico a avanzado",topics:[
"Packages: especificación + body, variables globales de package, SERIALLY_REUSABLE",
"Cursores: explícitos, FOR loops, REF CURSOR, SYS_REFCURSOR, bulk operations",
"BULK COLLECT + FORALL: optimizar operaciones masivas (reducir context switches)",
"Tipos: VARRAY, TABLE OF (INDEX BY), RECORD — cuándo usar cada uno",
"Triggers: BEFORE/AFTER/INSTEAD OF, compound triggers para bulk DML",
"DBMS_SCHEDULER: reemplaza cron para jobs Oracle — aprenderlo bien",
"Packages imprescindibles: DBMS_OUTPUT, UTL_FILE, DBMS_CRYPTO, DBMS_LOB, UTL_HTTP"
],
resources:[
{label:"Oracle 19c PL/SQL Language Reference",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/lnpls/index.html"},
{label:"oracle-base.com: PL/SQL desde cero",url:"https://oracle-base.com/articles/misc/introduction-to-plsql"},
{label:"Oracle Dev Gym — ejercicios y quizzes PL/SQL gratis",url:"https://devgym.oracle.com"}
]},
{num:"3.3",title:"Certificación Oracle SQL 1Z0-071",cert:true,topics:[
"Examen: 73 preguntas tipo test, 120 min, nota mínima 63%",
"Temario: DML, DDL, funciones de grupo, joins, subqueries, set operators, vistas, secuencias",
"Precio: ~245 USD — busca vouchers 25% en oracle.com/education",
"Estrategia: Oracle Live SQL + Dev Gym daily quizzes durante 6 semanas",
"Registro en Pearson VUE — puedes hacer online proctored desde casa"
],
resources:[
{label:"Exam guide oficial 1Z0-071",url:"https://education.oracle.com/oracle-database-sql/pexam_1Z0-071"},
{label:"Oracle Dev Gym — practice exams gratis",url:"https://devgym.oracle.com"},
{label:"MyLearn Oracle — curso SQL Fundamentals",url:"https://mylearn.oracle.com"}
]}
]},

{id:"p4",tag:"oracle",cert:false,status:"next",label:"Fase 4",title:"Backup, Recovery y RMAN — lo más crítico",duration:"Meses 3–6",

{num:"4.1",title:"Fundamentos de backup en Oracle",topics:[
"ARCHIVELOG mode: activar, verificar, configurar LOG_ARCHIVE_DEST_n",
"Flash Recovery Area (FRA): DB_RECOVERY_FILE_DEST, DB_RECOVERY_FILE_DEST_SIZE",

"Consistent (closed) vs inconsistent (hot/online) — en producción siempre hot",

"Catálogo RMAN: crear, registrar target, ventajas sobre usar solo control file",
"CROSSCHECK, DELETE EXPIRED, DELETE OBSOLETE — limpieza automática",
"LIST/REPORT: LIST BACKUP SUMMARY, REPORT NEED BACKUP, REPORT OBSOLETE",
"DUPLICATE DATABASE FROM ACTIVE DATABASE — clonar para hacer lab sin parar producción",
"Compresión RMAN: BASIC, LOW, MEDIUM, HIGH — impacto en CPU vs espacio"
],

]},
{num:"4.3",title:"Recovery — escenarios reales del laboratorio",topics:[

"Escenario 3: perder todos los redo log members — pasos exactos de recuperación",
"Incomplete recovery: UNTIL TIME, UNTIL SCN, UNTIL SEQUENCE — cuándo y cómo",
"Flashback Database: configurar FLASHBACK ON, DB_FLASHBACK_RETENTION_TARGET",
"Flashback Table, Flashback Query, Flashback Drop — recuperación sin RMAN",
"Práctica obligatoria: simula cada fallo tú mismo en tu OL8, documenta los pasos"
],
resources:[
{label:"Oracle 19c: Performing Complete Database Recovery",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/bradv/performing-complete-database-recovery.html"},
{label:"oracle-base.com: Flashback Database",url:"https://oracle-base.com/articles/10g/flashback-database-10g"}
]}
]},

{id:"p5",tag:"oracle",cert:true,status:"next",label:"Fase 5",title:"Performance Tuning Oracle",duration:"Meses 5–10",

{num:"5.1",title:"Cost-Based Optimizer y planes de ejecución",topics:[

"Operaciones críticas: TABLE ACCESS FULL, INDEX RANGE SCAN, NESTED LOOPS, HASH JOIN, MERGE JOIN",
"Hints: /*+ FULL(t) */ /*+ INDEX(t idx) */ /*+ USE_HASH(a b) */ /*+ PARALLEL(4) */",
"SQL Plan Baselines (SPM): estabilizar planes sin hints en código"
],
resources:[
{label:"Oracle 19c SQL Tuning Guide",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/tgsql/index.html"},
{label:"oracle-base.com: Explain Plan",url:"https://oracle-base.com/articles/misc/explaining-the-explain-plan"},
{label:"Blog Jonathan Lewis — optimizer profundo",url:"https://jonathanlewis.wordpress.com"}
]},
{num:"5.2",title:"Índices y estadísticas",topics:[

"Function-Based Index (FBI): para WHERE UPPER(col)='X' o WHERE col+1=5",
"Invisible Index: probar un índice sin afectar al optimizador en producción",
"DBMS_STATS.GATHER_TABLE_STATS: opciones estimate_percent, method_opt, cascade",

],
resources:[
{label:"Oracle 19c: Managing Indexes",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/admin/managing-indexes.html"},

]},
{num:"5.3",title:"AWR, ASH, ADDM y Wait Events",topics:[

"Real-Time SQL Monitoring: DBMS_SQLTUNE.REPORT_SQL_MONITOR para queries largas"
],
resources:[
{label:"Oracle 19c: AWR Reference",url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/refrn/dynamic-performance-v-views-3.html"},
{label:"oracle-base.com: AWR y ADDM",url:"https://oracle-base.com/articles/10g/automatic-workload-repository-10g"},
{label:"Blog Tanel Poder — ASH avanzado",url:"https://tanelpoder.com"}
]},
{num:"5.4",title:"Certificaciones OCP 19c — 1Z0-082 y 1Z0-083",cert:true,topics:[
"1Z0-082 DBA I: arquitectura, instalación, storage, seguridad, network, backup básico",
"1Z0-083 DBA II: tuning, HA, Data Guard, Multitenant, Resource Manager, Scheduler",
"Precio: ~245 USD por examen — hazlos en orden 082 → 083",
"Estudio: MyLearn Oracle + oracle-base.com + práctica en tu OL8 (el mejor simulador eres tú)",
"Tiempo recomendado: 2 meses de estudio intenso por examen",
"Grupos de estudio: foro OraWorld.org en español"
],
resources:[
{label:"Exam guide 1Z0-082 — temario oficial",url:"https://education.oracle.com/oracle-database-administration-i/pexam_1Z0-082"},
{label:"Exam guide 1Z0-083 — temario oficial",url:"https://education.oracle.com/oracle-database-administration-ii/pexam_1Z0-083"},
{label:"MyLearn Oracle — cursos de preparación",url:"https://mylearn.oracle.com"},
{label:"OraWorld — comunidad Oracle hispanohablante",url:"https://www.oraworld.org"}
]}
]},

let activeFilter='all';

function filterPhases(tag,btn){
  activeFilter=tag;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPhases();
}

function togglePhase(id){
  const body=document.getElementById('body-'+id);
  const chev=document.getElementById('chev-'+id);
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  chev.classList.toggle('open',!isOpen);
}

function badgeStyle(status){
  if(status==='current') return 'background:var(--color-background-success);color:var(--color-text-success)';
  if(status==='next') return 'background:var(--color-background-warning);color:var(--color-text-warning)';
  return 'background:var(--color-background-secondary);color:var(--color-text-secondary)';
}

function modBadgeStyle(status){
  if(status==='current') return 'background:var(--color-background-success);color:var(--color-text-success)';
  if(status==='next') return 'background:var(--color-background-warning);color:var(--color-text-warning)';
  return 'background:var(--color-background-secondary);color:var(--color-text-secondary)';
}

function renderPhases(){
  const container=document.getElementById('phases-container');
  let filtered=phases;
  if(activeFilter==='cert') filtered=phases.filter(p=>p.cert||p.modules.some(m=>m.cert));
  else if(activeFilter!=='all') filtered=phases.filter(p=>p.tag===activeFilter);

  container.innerHTML=filtered.map(phase=>{
    const bs=badgeStyle(phase.status);
    const mods=phase.modules.map(mod=>{
      const ms=modBadgeStyle(phase.status);
      const ol8tag=mod.ol8?`<span class="tag-ol">OL8</span>`:'';
      const certBadge=mod.cert?`<span class="cert-badge">Certificación</span>`:'';
      const topics=mod.topics.map(t=>`<li>${t}</li>`).join('');
      const resBlock=mod.resources&&mod.resources.length?`
        <div class="res-block">
          <div class="res-title">Documentación y recursos</div>
          <div class="res-links">
            ${mod.resources.map(r=>`<a href="${r.url}" target="_blank">${r.label}</a>`).join('')}
          </div>
        </div>`:'';
      return `<div class="mod">
        <div class="mod-title">
          <span class="mod-num" style="${ms}">${mod.num}</span>
          ${mod.title}
          ${ol8tag}${certBadge}
        </div>
        <ul class="topics">${topics}</ul>
        ${resBlock}
      </div>`;
    }).join('');
    return `<div class="phase-block">
      <div class="phase-hdr" onclick="togglePhase('${phase.id}')">
        <span class="phase-badge" style="${bs}">${phase.label}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-dur">${phase.duration}</span>
        <span class="chev" id="chev-${phase.id}">▾</span>
      </div>
      <div class="phase-body" id="body-${phase.id}">${mods}</div>
    </div>`;
  }).join('');
}

renderPhases();
</script>
