      { name: 'LinkedIn (perfil DBA)', type: 'Red profesional · Gratuito', desc: 'Optimiza tu perfil con las keywords: Oracle DBA, PostgreSQL, Cloud DBA, migration.', url: 'https://www.linkedin.com', color: '#993556' },
      { name: 'Toptal Database', type: 'Plataforma elite · Comisión', desc: 'Para los mejores proyectos. El proceso de selección es riguroso pero vale la pena.', url: 'https://www.toptal.com/dba', color: '#721F3E' },

const progBar = document.getElementById('progBar');
const phasesNav = document.getElementById('phasesNav');
const phasePanels = document.getElementById('phasePanels');

phases.forEach((phase, i) => {
  const seg = document.createElement('div');
  seg.className = 'prog-seg' + (i === 0 ? ' active' : '');
  seg.style.background = phase.color;
  seg.onclick = () => selectPhase(i);
  progBar.appendChild(seg);

  const btn = document.createElement('button');
  btn.className = 'phase-btn' + (i === 0 ? ' active' : '');
  btn.textContent = phase.label + ' — ' + phase.name;
  btn.onclick = () => selectPhase(i);
  if (i === 0) { btn.style.background = phase.color; btn.style.borderColor = phase.color; btn.style.color = '#fff'; }
  phasesNav.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'phase-panel' + (i === 0 ? ' active' : '');
  panel.id = 'panel-' + i;

  const timelineBg = phase.bg;
  const tc = phase.color;

  let topicsHTML = phase.topics.map(t => `
    <div class="topic-card">
      <div class="topic-card-header">
        <div class="dot" style="background:${tc}"></div>
        <h3>${t.name}</h3>
      </div>
      <div class="topic-items">
        ${t.items.map(item => `<div class="topic-item">${item}</div>`).join('')}
      </div>
    </div>
  `).join('');

  let resHTML = phase.resources.map(r => `
    <div class="res-card" onclick="openLink('${r.url}')">
      <div class="res-name">${r.name}</div>
      <div class="res-type">${r.type}</div>
      <div class="res-desc">${r.desc}</div>
      <a class="res-link" href="${r.url}" style="color:${r.color}" onclick="event.stopPropagation()">${r.url.replace('https://', '').split('/')[0]} ↗</a>
    </div>
  `).join('');

  let certsHTML = phase.certs.map(c => `
    <span class="cert-badge" style="background:${c.color}22; color:${c.color}; border: 1px solid ${c.color}44">🎓 ${c.name}</span>
  `).join('');

  panel.innerHTML = `
    <div class="phase-header">
      <div class="phase-icon" style="background:${timelineBg}; font-size:24px;">${phase.icon}</div>
      <div class="phase-meta">
        <h2>${phase.name}</h2>
        <div class="sub">${phase.desc}</div>
        <span class="timeline" style="background:${timelineBg}; color:${tc}">⏱ ${phase.timeline}</span>
      </div>
    </div>
    <div class="topics-grid">${topicsHTML}</div>
    <div style="margin-top:1rem">${certsHTML}</div>
    <div class="resources-section">
      <h3>Recursos clave</h3>
      <div class="resources-grid">${resHTML}</div>
    </div>
    <div class="lab-section">
      <h3>🧪 ${phase.lab.title}</h3>
      <div class="lab-cmd">${phase.lab.cmd}</div>
      <div class="lab-note">${phase.lab.note}</div>
    </div>
    <button class="ask-btn" onclick="sendPrompt('Dame más detalle sobre la ${phase.label}: ${phase.name}. Qué debo estudiar primero y cómo practicarlo en Oracle Linux 8.10')">Profundizar en ${phase.name} ↗</button>
  `;

  phasePanels.appendChild(panel);
});

function selectPhase(idx) {
  document.querySelectorAll('.prog-seg').forEach((s, i) => s.classList.toggle('active', i === idx));
  document.querySelectorAll('.phase-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
    if (i === idx) { b.style.background = phases[i].color; b.style.borderColor = phases[i].color; b.style.color = '#fff'; }
    else { b.style.background = ''; b.style.borderColor = ''; b.style.color = ''; }
  });
  document.querySelectorAll('.phase-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}
</script>
