let activeFilter = 'all';

function filterPhases(tag, btn) {
  activeFilter = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPhases();
}

function togglePhase(id) {
  const content = document.getElementById('content-' + id);
  const chevron = document.getElementById('chevron-' + id);
  if (content.classList.contains('open')) {
    content.classList.remove('open');
    chevron.classList.remove('open');
  } else {
    content.classList.add('open');
    chevron.classList.add('open');
  }
}

function renderPhases() {
  const container = document.getElementById('phases-container');
  const filtered = activeFilter === 'all' ? phases : phases.filter(p => p.tag === activeFilter);
  container.innerHTML = filtered.map(phase => {
    const statusStyle = phase.status === 'current' 
      ? 'background:var(--color-background-success);color:var(--color-text-success)'
      : phase.status === 'next'
      ? 'background:var(--color-background-warning);color:var(--color-text-warning)'
      : 'background:var(--color-background-secondary);color:var(--color-text-tertiary)';
    const statusLabel = phase.status === 'current' ? 'Empezar ya' : phase.status === 'next' ? 'Próximo' : 'Futuro';
    
    return `
    <div class="phase-block">
      <div class="phase-block-header" onclick="togglePhase('${phase.id}')">
        <span class="phase-badge" style="${statusStyle}">${phase.label}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-duration">${phase.duration}</span>
        <span class="chevron" id="chevron-${phase.id}">▾</span>
      </div>
      <div class="phase-content" id="content-${phase.id}">
        ${phase.modules.map(mod => `
          <div class="module">
            <div class="module-title">
              <span class="mod-num" style="${statusStyle}">${mod.num}</span>
              ${mod.title}
            </div>
            <ul class="topics">
              ${mod.topics.map(t => `<li>${t}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

renderPhases();
</script>
